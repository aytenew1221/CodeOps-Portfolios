<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Addis Market Shopping List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="container">
      <h1>Addis Market</h1>
      <p>Add items you need to buy and track your total.</p>

      <form id="item-form">
        <div>
          <label for="item-name">Item Name</label>
          <input type="text" id="item-name" placeholder="e.g. Coffee" />
        </div>

        <div>
          <label for="item-price">Price (ETB)</label>
          <input type="number" id="item-price" placeholder="e.g. 500" min="0" />
        </div>

        <button type="submit">Add Item</button>
      </form>

      <p id="message"></p>

      <section>
        <h2>Shopping List</h2>

        <ul id="shopping-list"></ul>

        <h2>
          Total:
          <span id="total">ETB 0</span>
        </h2>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
