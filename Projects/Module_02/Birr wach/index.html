<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Birr Watch - Live Ethiopian Birr exchange-rate tracker"
    />

    <title>Birr Watch</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="container">
      <!-- Header -->
      <header class="header">
        <h1>🇪🇹 Birr Watch</h1>
        <p>Live Ethiopian Birr exchange-rate tracker</p>
      </header>

      <!-- API Status -->
      <p id="status" class="status" role="status" aria-live="polite">
        Loading live exchange rates...
      </p>

      <!-- Currency Converter -->
      <section class="card">
        <h2>Currency Converter</h2>

        <form id="convert-form" novalidate>
          <div class="form-group">
            <label for="amount">Amount in ETB</label>

            <input
              type="number"
              id="amount"
              min="0.01"
              step="0.01"
              value="100"
              placeholder="Enter amount"
              inputmode="decimal"
              required
            />
          </div>

          <div class="form-group">
            <label for="currency">Convert to</label>

            <select id="currency" required disabled>
              <option value="">Loading currencies...</option>
            </select>
          </div>

          <button id="convert-button" type="submit" disabled>Convert</button>
        </form>

        <p id="result" class="result" aria-live="polite"></p>
      </section>

      <!-- Watchlist -->
      <section class="card">
        <div class="section-header">
          <h2>My Watchlist</h2>

          <span id="watch-count" aria-label="Number of currencies in watchlist">
            0
          </span>
        </div>

        <ul id="watchlist" aria-label="Currency watchlist"></ul>

        <p id="empty-message" class="empty-message">
          No currencies in your watchlist.
        </p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
